[package]
name = "wowmc"
version = "0.1.0"
edition = "2021"
default-run = "wowmc"
description = "World of Warcraft Macro Management CLI"
license = "MIT"
repository = "https://github.com/nu-sync/wowmc"
readme = "README.md"

[features]
default = []
gui = ["dep:eframe"]

[dependencies]
anstream = "1"
anyhow = "1"
atomicwrites = "0.4"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[dependencies.eframe]
version = "0.31"
optional = true
default-features = false
features = ["accesskit", "default_fonts", "glow", "x11", "wayland"]

[[bin]]
name = "wowmc-gui"
path = "src/gui.rs"
required-features = ["gui"]
